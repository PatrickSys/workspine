name: smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CLI help surface exits clean
        run: node bin/gsdd.mjs help
      - name: init, next, and preflight run clean in a throwaway fixture
        shell: bash
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/bin/gsdd.mjs"
          FIXTURE="$(mktemp -d)"
          cd "$FIXTURE"
          node "$CLI" init --auto --tools claude
          node "$CLI" next --init
          node "$CLI" next
          node "$CLI" lifecycle-preflight progress
      - name: Publish-path smoke — npm pack + install tarball (D-74; catches bin-name mapping bugs npx-on-checkout cannot)
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR="$(mktemp -d)"
          INSTALL_DIR="$(mktemp -d)"
          npm pack --ignore-scripts --pack-destination "$PACK_DIR" --silent >/dev/null
          TARBALL="$(find "$PACK_DIR" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          cd "$INSTALL_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-save "$TARBALL" >/dev/null
          PACKAGE_DIR="$INSTALL_DIR/node_modules/gsdd-cli"
          test -f "$PACKAGE_DIR/distilled/references/proof-rules.md"
          test -f "$PACKAGE_DIR/distilled/references/observation-record.md"
          test ! -e "$PACKAGE_DIR/tests"
          node -e "const pkg=require(process.argv[1]); if (pkg.scripts?.test || pkg.scripts?.['test:gsdd']) process.exit(1)" "$PACKAGE_DIR/package.json"
          ./node_modules/.bin/gsdd help
      - name: Full test suite (includes the next-card snapshot)
        run: node tests/run-all.cjs --covers=gsdd.next-card.test.cjs
