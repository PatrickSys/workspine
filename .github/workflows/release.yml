name: Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA on main to release
        required: true

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Test & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Guard the dispatched commit to main
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::the dispatched SHA must be exactly 40 hexadecimal characters"
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error::checkout is not the dispatched exact commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::the dispatched commit is not on main"
            exit 1
          fi
          printf 'release guard: exact commit %s is on main\n' "$RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Use npm trusted-publishing capable CLI
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dev dependencies
        run: npm ci

      - name: Run tests
        run: node tests/run-all.cjs --covers=gsdd.next-card.test.cjs

      - name: Audit packed tarball surface
        run: npm pack --dry-run --json

      - name: Verify npm trusted publisher
        run: |
          OIDC_TOKEN=$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r '.value')
          STATUS=$(curl -sS \
            -o /tmp/npm-oidc.json \
            -w "%{http_code}" \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/workspine" \
            -H "Authorization: Bearer ${OIDC_TOKEN}")
          if [[ ! "${STATUS}" =~ ^2 ]]; then
            cat /tmp/npm-oidc.json
            echo "::error::npm trusted publishing is not configured for workspine. Configure npm package trusted publisher for PatrickSys/workspine using release.yml before running semantic-release."
            exit 1
          fi

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release
