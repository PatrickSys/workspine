<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-label="Two ways in: work-quick for a bounded change, or work-new-project which writes a spec and roadmap first. Both feed a plan, execute, verify loop that repeats and writes a file at every step. work-pause writes a checkpoint that gsdd next reads to resume.">
  <defs>
    <style>
      .bg    { fill: #EFEDE4; }
      .ink   { fill: #12100E; }
      .mono  { font-family: 'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace; }
      .disp  { font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 700; }
      .kicker{ font-size: 13px; letter-spacing: 2.4px; fill: #E4472E; }
      .rlbl  { font-size: 11px; letter-spacing: 2.2px; fill: #E4472E; }
      .label { font-size: 14px; letter-spacing: 1.4px; fill: #12100E; }
      .sub   { font-size: 11.5px; letter-spacing: .5px; fill: #6B6B63; }
      .file  { font-size: 12px; fill: #2F6B4F; }
      .box   { fill: none; stroke: #12100E; stroke-width: 1.6; }
      .boxf  { fill: #E3E0D2; stroke: #12100E; stroke-width: 1.6; }
      .rule  { stroke: #2F6B4F; stroke-width: 2; }
      .flow  { stroke: #12100E; stroke-width: 1.6; fill: none; }
      .back  { stroke: #E4472E; stroke-width: 1.7; fill: none; stroke-dasharray: 6 5; }
      .tick  { stroke: #E4472E; stroke-width: 3; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#12100E"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E4472E"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="530"/>

  <!-- header -->
  <line class="tick" x1="56" y1="46" x2="92" y2="46"/>
  <text class="mono kicker" x="104" y="51">THE LOOP</text>
  <text class="disp ink" x="56" y="98" font-size="38">Decide once. Carry it forward.</text>
  <text class="mono sub" x="56" y="124" font-size="12.5">Every step writes a file to the repo. Nothing important lives only in the chat.</text>
  <line class="rule" x1="56" y1="152" x2="904" y2="152"/>

  <!-- repeat path -->
  <text class="mono rlbl" x="466" y="182">NEXT PHASE</text>
  <path class="back" d="M772 232 L772 196 Q772 190 764 190 L355 190 Q347 190 347 196 L347 226" marker-end="url(#ar)"/>

  <!-- two ways in -->
  <text class="mono rlbl" x="56" y="182" fill="#6B6B63">START EITHER WAY</text>

  <rect class="boxf" x="56" y="200" width="176" height="56" rx="3"/>
  <text class="mono label" x="72" y="226">work-quick</text>
  <text class="mono sub"   x="72" y="244">a change you can describe</text>

  <rect class="boxf" x="56" y="278" width="176" height="56" rx="3"/>
  <text class="mono label" x="72" y="304">work-new-project</text>
  <text class="mono file"  x="72" y="322">SPEC.md + ROADMAP.md</text>

  <path class="flow" d="M232 228 Q262 228 262 252 L262 262" marker-end="url(#a)"/>
  <path class="flow" d="M232 306 Q262 306 262 282 L262 272" marker-end="url(#a)"/>
  <path class="flow" d="M262 268 L274 268" marker-end="url(#a)"/>

  <!-- loop -->
  <rect class="box" x="276" y="232" width="150" height="72" rx="3"/>
  <text class="mono label" x="292" y="264">PLAN</text>
  <text class="mono sub"   x="292" y="284">research, then review</text>
  <text class="mono file"  x="292" y="330">phases/N/PLAN.md</text>

  <path class="flow" d="M426 268 L482 268" marker-end="url(#a)"/>

  <rect class="box" x="484" y="232" width="150" height="72" rx="3"/>
  <text class="mono label" x="500" y="264">EXECUTE</text>
  <text class="mono sub"   x="500" y="284">only what was approved</text>
  <text class="mono file"  x="500" y="330">phases/N/SUMMARY.md</text>

  <path class="flow" d="M634 268 L690 268" marker-end="url(#a)"/>

  <rect class="box" x="692" y="232" width="168" height="72" rx="3"/>
  <text class="mono label" x="708" y="264">VERIFY</text>
  <text class="mono sub"   x="708" y="284">are the claims true?</text>
  <text class="mono file"  x="708" y="330">phases/N/VERIFICATION.md</text>

  <!-- continuity -->
  <line class="rule" x1="56" y1="386" x2="904" y2="386"/>
  <line class="tick" x1="56" y1="418" x2="92" y2="418"/>
  <text class="mono kicker" x="104" y="423">WHEN THE SESSION ENDS</text>

  <rect class="boxf" x="56" y="442" width="186" height="48" rx="3"/>
  <text class="mono label" x="72" y="472">work-pause</text>

  <path class="flow" d="M242 466 L296 466" marker-end="url(#a)"/>

  <rect class="box" x="298" y="442" width="228" height="48" rx="3"/>
  <text class="mono file" x="314" y="472">.work/.continue-here.md</text>

  <path class="flow" d="M526 466 L580 466" marker-end="url(#a)"/>

  <rect class="box" x="582" y="442" width="150" height="48" rx="3"/>
  <text class="mono label" x="598" y="472">gsdd next</text>

  <text class="mono rlbl" x="762" y="448">RESUMES</text>
  <path class="back" d="M732 466 L896 466 Q904 466 904 458 L904 276 Q904 268 896 268 L890 268" marker-end="url(#ar)"/>
  <path class="back" d="M878 232 L878 304" stroke-dasharray="none" stroke-width="1.4"/>
  <path class="back" d="M874 232 L882 232 M874 304 L882 304" stroke-dasharray="none" stroke-width="1.4"/>
</svg>
